<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MeetLedger - Live Attendance Companion</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <div class="sp-container">
    <!-- Header -->
    <header class="sp-header">
      <div class="sp-brand">
        <div class="sp-logo">ML</div>
        <div>
          <h2>MeetLedger</h2>
          <span class="sp-sub">Live Meeting Companion</span>
        </div>
      </div>
      <div class="sp-header-actions">
        <button id="sp-btn-scan" class="sp-icon-btn" title="Force Scan Now">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.2"/></svg>
        </button>
        <button id="sp-btn-ai" class="sp-icon-btn" title="Ask MeetLedger AI">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/></svg>
        </button>
        <button id="sp-btn-dashboard" class="sp-icon-btn" title="Open Full Dashboard">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="9" y1="21" x2="9" y2="9"/></svg>
        </button>
      </div>
    </header>

    <!-- Meeting Info Banner -->
    <section class="sp-meeting-banner">
      <div class="sp-meta-info">
        <h3 id="sp-meeting-title">Loading meeting...</h3>
        <span id="sp-meeting-code" class="sp-code">---</span>
      </div>
      <div class="sp-timer-wrap">
        <span class="sp-timer-label">Duration</span>
        <span id="sp-meeting-timer" class="sp-timer">00:00</span>
      </div>
    </section>

    <!-- Key Metrics Cards -->
    <section class="sp-metrics-grid">
      <div class="sp-metric-card">
        <span class="sp-metric-label">Present</span>
        <span id="sp-stat-present" class="sp-metric-val text-success">0</span>
      </div>
      <div class="sp-metric-card">
        <span class="sp-metric-label">Total Unique</span>
        <span id="sp-stat-total" class="sp-metric-val">0</span>
      </div>
      <div class="sp-metric-card">
        <span class="sp-metric-label">Avg Attendance</span>
        <span id="sp-stat-avg" class="sp-metric-val">0%</span>
      </div>
    </section>

    <!-- Tabs Navigation -->
    <div class="sp-tabs">
      <button class="sp-tab-btn active" data-tab="participants">Participants</button>
      <button class="sp-tab-btn" data-tab="activity">Live Activity Feed</button>
    </div>

    <!-- Tab 1: Participants List -->
    <section id="tab-participants" class="sp-tab-content active">
      <div class="sp-search-bar">
        <input type="text" id="sp-search-input" placeholder="Search by name or enrollment...">
      </div>
      <div id="sp-participants-list" class="sp-list">
        <div class="sp-empty">Waiting for participants...</div>
      </div>
    </section>

    <!-- Tab 2: Activity Feed -->
    <section id="tab-activity" class="sp-tab-content">
      <div id="sp-activity-feed" class="sp-list sp-activity-list">
        <div class="sp-empty">No activity events yet.</div>
      </div>
    </section>

    <!-- Bottom Controls -->
    <footer class="sp-footer">
      <button id="sp-btn-toggle-pause" class="btn btn-secondary">
        Pause Tracking
      </button>
      <button id="sp-btn-export" class="btn btn-primary">
        Export CSV
      </button>
    </footer>

    <!-- Sidepanel Developer Credit -->
    <div class="sp-dev-credit">
      <span>By <a href="https://sumitrathor.rf.gd/" target="_blank" rel="noopener noreferrer">Sumit Rathor</a> &bull; &copy; 2026 MeetLedger</span>
    </div>
  </div>

  <script src="../shared/constants.js"></script>
  <script src="../shared/time-utils.js"></script>
  <script src="../shared/identity.js"></script>
  <script src="../shared/database.js"></script>
  <script src="../shared/storage.js"></script>
  <script src="../shared/export.js"></script>
  <script src="sidepanel.js"></script>
</body>
</html>
